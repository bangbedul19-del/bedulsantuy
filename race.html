<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Simulasi Unggah Berkas Tertunda</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .status { margin-top: 10px; font-weight: bold; color: blue; }
    </style>
</head>
<body>

    <h1>Simulasi File Upload dengan Delay</h1>
    
    <button id="btnUpload" onclick="prosesUnggahTertunda()">1 Klik untuk Upload</button>
    
    <input type="file" id="fileInput" style="display: none;" onchange="berkasDipilih(event)">

    <div id="statusMulai" class="status"></div>

    <script>
        function prosesUnggahTertunda() {
            const statusDiv = document.getElementById('statusMulai');
            statusDiv.innerText = "Tombol diklik. Menunggu 3 detik sebelum membuka pemilih berkas...";
            statusDiv.style.color = "blue";

            // Mengatur delay menggunakan setTimeout (misal: 3000 milidetik / 3 detik)
            setTimeout(function() {
                statusDiv.innerText = "Membuka kotak dialog berkas...";
                statusDiv.style.color = "green";
                
                // Memicu klik pada input file tersembunyi
                document.getElementById('fileInput').click();
            }, 3000); 
        }

        function berkasDipilih(event) {
            const file = event.target.files[0];
            if (file) {
                alert("Berkas siap diproses: " + file.name);
                // Di sini Anda dapat menambahkan logika penanganan berkas (e.g., Fetch/Axios ke server)
            }
        }
    </script>

</body>
</html>
